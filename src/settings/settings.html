<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="settingsTitle"></title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <h1 data-i18n="settingsTitle"></h1>

    <!-- ========== LLM 配置管理 ========== -->
    <section class="config-management">
        <div class="section-header">
            <h2>LLM 配置管理</h2>
            <button id="btn-new-config" class="btn-primary">+ 新建配置</button>
        </div>

        <!-- 配置卡片列表 -->
        <div id="config-list" class="config-list"></div>

        <!-- 空状态 -->
        <div id="config-empty" class="config-empty" style="display:none;">
            <p>暂无配置，点击「新建配置」按钮创建第一个 LLM 配置档案</p>
        </div>
    </section>

    <!-- ========== 目标语言设置 ========== -->
    <section class="target-language-settings">
        <h2 data-i18n="targetLanguageSettingsTitle"></h2>

        <div class="form-group">
            <label for="default-target-language" data-i18n="defaultTargetLanguageLabel"></label>
            <p class="hint" data-i18n="defaultTargetLanguageHint"></p>
            <select id="default-target-language"></select>
        </div>

        <div class="form-group">
            <label for="second-target-language" data-i18n="secondTargetLanguageLabel"></label>
            <p class="hint" data-i18n="secondTargetLanguageHint"></p>
            <select id="second-target-language"></select>
        </div>
    </section>

    <!-- ========== GitHub Section ========== -->
    <section class="github-section">
        <div class="github-content">
            <h3 data-i18n="githubSectionTitle"></h3>
            <p data-i18n="githubDescription"></p>
            <div class="github-actions">
                <a href="https://github.com/Abelliuxl/ez-translate-lite" target="_blank" class="github-link" data-i18n="visitGitHub"></a>
                <a href="https://github.com/Abelliuxl/ez-translate-lite/issues" target="_blank" class="github-link issue-link" data-i18n="reportIssue"></a>
            </div>
            <p class="github-encouragement" data-i18n="githubEncouragement"></p>
        </div>
    </section>

    <!-- ========== 配置编辑模态框 ========== -->
    <div id="config-modal" class="modal" style="display:none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">新建配置</h3>
                <button id="modal-close" class="modal-close" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <!-- 配置名称 -->
                <div class="form-group">
                    <label for="config-name">配置名称</label>
                    <input type="text" id="config-name" placeholder="例如：DeepSeek V3 快速翻译">
                </div>

                <!-- 提供商选择 -->
                <div class="form-group">
                    <label for="config-provider">选择提供商</label>
                    <select id="config-provider">
                        <option value="">请选择提供商</option>
                        <optgroup label="聚合平台">
                            <option value="openrouter">OpenRouter</option>
                            <option value="siliconflow">硅基流动 (SiliconFlow)</option>
                        </optgroup>
                        <optgroup label="中国平台">
                            <option value="longcat">Longcat AI</option>
                            <option value="minimax">MiniMax</option>
                            <option value="zhipuai">智谱AI</option>
                            <option value="moonshot">月之暗面 Kimi</option>
                            <option value="deepseek">深度求索 DeepSeek</option>
                            <option value="qwen">通义千问</option>
                            <option value="doubao">字节跳动豆包</option>
                        </optgroup>
                        <optgroup label="自定义兼容">
                            <option value="custom-openai">自定义 OpenAI 兼容</option>
                            <option value="custom-anthropic">自定义 Anthropic 兼容</option>
                        </optgroup>
                    </select>
                </div>

                <!-- API Key -->
                <div class="form-group" id="config-apikey-group" style="display:none;">
                    <label>
                        <span id="config-apikey-label">API密钥</span>
                        <a href="#" id="config-apikey-help" target="_blank" style="display:none;">获取帮助</a>
                    </label>
                    <div class="api-key-container">
                        <div class="input-with-toggle">
                            <input type="password" id="config-apikey-input" placeholder="请输入API密钥">
                            <button id="config-toggle-apikey" class="toggle-btn" type="button" title="显示/隐藏">👁️</button>
                        </div>
                        <button id="config-test-connection" class="btn-secondary">测试连接</button>
                    </div>
                </div>

                <!-- Server URL -->
                <div class="form-group" id="config-serverurl-group" style="display:none;">
                    <label>
                        <span id="config-serverurl-label">服务器地址</span>
                        <a href="#" id="config-serverurl-help" target="_blank" style="display:none;">获取帮助</a>
                    </label>
                    <div class="api-key-container">
                        <input type="text" id="config-serverurl-input" placeholder="http://localhost:11434">
                        <button id="config-test-server" class="btn-secondary">测试连接</button>
                    </div>
                </div>

                <!-- 模型选择 -->
                <div class="form-group">
                    <label for="config-model-select">选择模型</label>
                    <div class="model-controls">
                        <select id="config-model-select" disabled>
                            <option>请先配置API密钥并获取模型列表</option>
                        </select>
                        <button id="config-fetch-models" class="btn-action" disabled>获取模型列表</button>
                    </div>
                    <p class="hint" id="config-model-hint">配置API密钥后点击"获取模型列表"按钮</p>
                </div>

                <!-- 自定义模型 -->
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="config-custom-model-checkbox">
                        <span>使用自定义模型</span>
                    </label>
                    <div id="config-custom-model-section" style="display:none;" class="custom-model-section">
                        <input type="text" id="config-custom-model-input" placeholder="请输入自定义模型名称" class="custom-model-input">
                        <p class="hint">某些提供商可能不支持远程获取模型列表，您可以在此手动输入模型名称</p>
                    </div>
                </div>

                <!-- ====== 高级选项 ====== -->
                <div class="advanced-section">
                    <h4>高级选项</h4>

                    <!-- 思考模式 -->
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="config-thinking-checkbox">
                            <span>启用思考模式</span>
                        </label>
                        <p class="hint">启用后模型会进行深度思考再回答。对 DeepSeek R1 等推理模型建议开启。</p>
                    </div>

                    <!-- 推理强度 -->
                    <div class="form-group" id="config-reasoning-group">
                        <label for="config-reasoning-select">推理强度</label>
                        <select id="config-reasoning-select">
                            <option value="min">min</option>
                            <option value="low" selected>low</option>
                            <option value="medium">medium</option>
                            <option value="high">high</option>
                            <option value="max">max</option>
                        </select>
                    </div>

                    <!-- 自定义推理强度 -->
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="config-custom-reasoning-checkbox">
                            <span>自定义推理强度值</span>
                        </label>
                        <div id="config-custom-reasoning-section" style="display:none;" class="custom-model-section">
                            <input type="text" id="config-custom-reasoning-input" placeholder="例如：xhigh、minimal、mini">
                            <p class="hint">勾选后，下拉预设选项将被禁用，以你填写的自定义值为准。</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-cancel" class="btn-secondary" type="button">取消</button>
                <button id="modal-save" class="btn-primary" type="button">保存配置</button>
            </div>
        </div>
    </div>

    <script src="settings.js"></script>
</body>
</html>
